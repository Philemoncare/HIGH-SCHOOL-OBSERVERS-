name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies (root + workspaces)
        run: npm ci

      - name: Frontend build
        run: npm run build:frontend

      - name: Backend lint and test
        run: |
          npm run lint --workspace=hso-backend
          npm run test --workspace=hso-backend

      - name: Archive frontend build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
